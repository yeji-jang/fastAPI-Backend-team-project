[project]
name = "asyncticket"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yeji-jang", email = "yejijang940@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "email-validator>=2.0.0",
    "httpx>=0.28.1",
]

[project.scripts]
asyncticket = "asyncticket:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
