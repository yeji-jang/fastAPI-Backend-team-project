{% extends "catalog_base.html" %}
{% block title %}공연 목록{% endblock %}
{% block head %}
{% include "catalog_detail_styles.html" %}
<style>
    .programme-hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); border: var(--line); }
    .programme-hero-copy { padding: clamp(1.2rem, 4vw, 3rem); background: #ff3d36; }
    .programme-hero-copy h1 { margin: .6rem 0 .8rem; }
    .programme-hero-copy p:last-child { margin-bottom: 0; }
    .programme-image { position: relative; margin: 0; min-height: 12rem; background: #222; color: white; }
    .programme-image img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .programme-image figcaption {
        position: absolute; right: .65rem; bottom: .65rem; background: #161616; padding: .25rem .4rem;
        font: 700 .65rem/1.3 monospace;
    }
    .programme-list { list-style: none; margin: 1.25rem 0 0; padding: 0; border-top: var(--line); }
    .programme-list li { border-bottom: var(--line); }
    .programme-link {
        display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
        gap: .5rem 1rem; align-items: center; text-decoration: none; padding: .9rem .35rem;
    }
    .programme-link:hover, .programme-link:focus-visible { background: #e9e9e7; }
    .programme-index { font: 700 .75rem monospace; }
    .programme-name { display: block; font-size: clamp(1.2rem, 3vw, 1.85rem); letter-spacing: -.035em; overflow-wrap: anywhere; }
    .programme-meta { display: block; color: #555; font-size: .8rem; }
    .programme-arrow { font: 700 .78rem monospace; white-space: nowrap; }
    .programme-paging a { display: inline-block; padding: .45rem .65rem; border: var(--line); margin-right: .45rem; }
    .programme-paging a[hidden] { display: none; }
    @media (max-width: 540px) {
        .programme-hero { grid-template-columns: minmax(0, 1fr); }
        .programme-image { min-height: 9rem; }
        .programme-link { gap: .45rem; }
    }
</style>
{% endblock %}
{% block content %}
<div class="detail-page">
    <header class="programme-hero">
        <div class="programme-hero-copy">
            <p class="detail-kicker">ASYNC TICKET / PROGRAMME</p>
            <h1>공연 목록</h1>
            <p>가까운 무대에서 만날 공연을 둘러보세요.</p>
        </div>
        <figure class="programme-image">
            <img src="{{ url_for('venue_assets', path='audience.jpg').path }}"
                 alt="무대를 바라보는 관객들의 흑백 이미지" width="1536" height="1024">
            <figcaption>공연장 분위기 · 연출 이미지</figcaption>
        </figure>
    </header>
    <p id="shows-status" role="status">공연을 불러오는 중…</p>
    <ul id="shows-list" class="programme-list" aria-label="등록된 공연"></ul>
    <nav class="programme-paging" aria-label="공연 목록 페이지">
        <a id="previous" hidden>이전</a>
        <a id="next" hidden>다음</a>
    </nav>
</div>
{% endblock %}
{% block script %}
<script>
    async function loadShows() {
        const status = document.querySelector("#shows-status");
        const list = document.querySelector("#shows-list");
        const query = new URLSearchParams(location.search);
        const page = Math.max(1, Number(query.get("page")) || 1);
        const params = new URLSearchParams({ page, size: 20 });
        if (query.has("venue_id")) params.set("venues_id", query.get("venue_id"));

        function setPageLink(id, number) {
            const link = document.querySelector(id);
            query.set("page", number);
            link.href = `?${query}`;
            link.hidden = false;
        }

        try {
            const { items, size, total } = await requestApi(`/v1/shows?${params}`);
            for (const [index, show] of items.entries()) {
                const item = document.createElement("li");
                const link = document.createElement("a");
                link.href = `/shows/${show.show_id}`;
                link.className = "programme-link";

                const number = document.createElement("span");
                number.className = "programme-index";
                number.textContent = String((page - 1) * size + index + 1).padStart(2, "0");
                number.setAttribute("aria-hidden", "true");

                const copy = document.createElement("span");
                const name = document.createElement("strong");
                name.className = "programme-name";
                name.textContent = show.title;
                const meta = document.createElement("small");
                meta.className = "programme-meta";
                meta.textContent = [show.type, show.performer, show.runtime ? `${show.runtime}분` : ""]
                    .filter(Boolean).join(" · ");
                copy.append(name, meta);

                const arrow = document.createElement("span");
                arrow.className = "programme-arrow";
                arrow.textContent = "상세 ↗";
                arrow.setAttribute("aria-hidden", "true");
                link.append(number, copy, arrow);
                item.append(link);
                list.append(item);
            }
            if (page > 1) setPageLink("#previous", page - 1);
            if (page * size < total) setPageLink("#next", page + 1);
            status.textContent = items.length ? "" : "표시할 공연이 없습니다.";
        } catch (error) {
            status.textContent = error.message;
        }
    }

    loadShows();
</script>
{% endblock %}
