{% extends "catalog_base.html" %}
{% block title %}예매 결제{% endblock %}
{% block head %}{% include "catalog_detail_styles.html" %}<meta name="referrer" content="no-referrer">{% endblock %}
{% block content %}
<main class="detail-page">
    <header class="detail-header"><p class="detail-kicker">CHECKOUT</p><h1>예매 결제</h1></header>
    <p id="checkout-status" role="status">예매를 확인하는 중…</p>
    <dl id="checkout-summary" hidden><dt>주문번호</dt><dd id="checkout-order"></dd><dt>결제 금액</dt><dd id="checkout-amount"></dd></dl>
    <button id="pay" type="button" disabled>토스페이먼츠 결제창 열기</button>
    <p><a href="/me/reservations">내 예매 내역</a></p>
</main>
{% endblock %}
{% block script %}
<script src="{{ url_for('venue_assets', path='booking.js').path }}"></script>
<script>
const reservationId = {{ reserv_id | tojson }};
const payButton = document.querySelector("#pay");
const checkoutStatus = document.querySelector("#checkout-status");

async function loadCheckout() {
    try {
        await bookingGateway.buyer();
        const currentReservation = await bookingGateway.request(`/v1/reservations/${reservationId}`);
        if (currentReservation.status !== "PENDING") {
            checkoutStatus.textContent = currentReservation.status === "CONFIRMED" ? "이미 확정된 예매입니다." : "결제를 진행할 수 없는 예매입니다.";
            return;
        }
        document.querySelector("#checkout-order").textContent = currentReservation.order_number;
        document.querySelector("#checkout-amount").textContent = `${Number(currentReservation.total_amount).toLocaleString("ko-KR")}원`;
        document.querySelector("#checkout-summary").hidden = false;
        const clientKey = (await bookingGateway.config()).toss_client_key;
        if (!clientKey) throw new Error("현재 온라인 결제를 이용할 수 없습니다. 잠시 후 내 예매에서 다시 시도해 주세요.");
        checkoutStatus.textContent = "결제창에서 결제를 진행해 주세요.";
        payButton.disabled = false;
    } catch (error) { checkoutStatus.textContent = error.message; }
}

payButton.addEventListener("click", async () => {
    payButton.disabled = true;
    try {
        checkoutStatus.textContent = "결제창을 준비하는 중…";
        await bookingGateway.resumePayment(reservationId);
        checkoutStatus.textContent = "결제창 안내를 확인해 주세요.";
    } catch (error) {
        checkoutStatus.textContent = error.code === "USER_CANCEL"
            ? "결제창을 닫았어요. 다시 이어서 결제할 수 있어요."
            : error.message || "결제 요청을 처리하지 못했습니다.";
    } finally {
        payButton.disabled = false;
    }
});
document.addEventListener("DOMContentLoaded", loadCheckout, { once: true });
</script>
{% endblock %}
